[package]
name = "algosketch"
description = "Turn real source code into language-neutral pseudocode and human-readable explanations"
keywords = ["pseudocode", "cli", "tree-sitter", "algorithm", "code-review"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "algosketch"
path = "src/main.rs"

[dependencies]
algosketch-core = { path = "../algosketch-core", version = "0.2.1" }
clap.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
